name: "ProxyInHA"
version: "1.3.8"
slug: "proxy_in_ha"
description: >-
  Reverse proxy sécurisé pour Home Assistant. Accédez à vos services locaux
  depuis n'importe où via le mTLS de HA. Génération automatique des certificats
  ou réutilisation de ceux de Caddy.
url: "https://github.com/TeALO36/ProxyInHA"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: "mdi:shield-lock"
panel_title: "ProxyInHA"
panel_admin: true
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
options:
  services: []
  check_interval: 30
  domain: ""
  tls_mode: "auto"
  caddy_cert_domain: ""
schema:
  services:
    - name: str
      url: url
      icon: "str?"
      enabled: bool
      public: "bool?"
      public_port: "int?"
  check_interval: "int(5,300)"
  domain: str
  tls_mode: str
  caddy_cert_domain: str
