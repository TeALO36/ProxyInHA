name: "ProxyInHA"
version: "1.1.0"
slug: "proxy_in_ha"
description: >-
  Reverse proxy pour accéder à vos services locaux via Home Assistant
  sans ouvrir de ports. Option mTLS pour exposer certains services
  publiquement avec les mêmes certificats que votre Caddy existant.
url: "https://github.com/TeALO36/ProxyInHA"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: "mdi:shield-network"
panel_title: "ProxyInHA"
panel_admin: true
map:
  - type: share
    read_only: false
options:
  services: []
  check_interval: 30
  domain: ""
  cert_path: ""
  cert_key_path: ""
  mtls_ca_path: ""
schema:
  services:
    - name: str
      url: url
      icon: "str?"
      enabled: bool
      public: bool
      public_port: "int?"
  check_interval: "int(5,300)"
  domain: str
  cert_path: str
  cert_key_path: str
  mtls_ca_path: str
