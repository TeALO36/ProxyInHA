worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    # ── Ingress principal ──────────────────────────────────────────────
    server {
        listen 8099 default_server;
        server_name _;

        # Fichiers statiques (dashboard)
        root /var/www/html;
        index index.html;

        # API Flask (tout ce qui commence par /api)
        location /api {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # Proxies internes vers services locaux (generés dynamiquement par Flask)
        include /etc/nginx/conf.d/proxy_*.conf;

        # Fichiers statiques du dashboard
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Serveurs mTLS publics (géneres dynamiquement) ─────────────────
    include /etc/nginx/mtls.d/*.conf;
}
